<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 | Mental Cream</title>
    <style>
        body { margin:0; min-height:100vh; display:grid; place-items:center; background:#f4f8f7; font-family:Arial,sans-serif; color:#263238; }
        main { width:min(380px, calc(100% - 40px)); background:#fff; padding:32px; border-radius:20px; box-shadow:0 16px 40px rgba(24,90,80,.12); }
        h1 { color:#1a8a7e; margin:0 0 8px; } p { color:#607d8b; }
        label { display:block; margin:18px 0 6px; font-weight:700; }
        input { width:100%; box-sizing:border-box; padding:13px; border:1px solid #d5dfdc; border-radius:10px; font-size:1rem; }
        button { width:100%; margin-top:22px; padding:13px; border:0; border-radius:10px; background:#1a8a7e; color:white; font-weight:700; cursor:pointer; }
        .message { padding:10px; border-radius:8px; background:#edf7f5; color:#17685f; }
        .error { background:#fff0f0; color:#b42318; } a { color:#1a8a7e; }
    </style>
</head>
<body>
<main>
    <h1>Mental Cream</h1>
    <p>내 기록으로 이어서 시작하세요.</p>
    <p class="message" th:if="${param.registered}">가입이 완료되었습니다. 로그인해주세요.</p>
    <p class="message" th:if="${param.logout}">안전하게 로그아웃되었습니다.</p>
    <p class="message error" th:if="${param.error}">아이디 또는 비밀번호를 확인해주세요.</p>
    <form th:action="@{/login}" method="post">
        <label for="username">아이디</label>
        <input id="username" name="username" autocomplete="username" required autofocus>
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">로그인</button>
    </form>
    <p>처음이신가요? <a th:href="@{/register}">회원가입</a></p>
</main>
</body>
</html>
